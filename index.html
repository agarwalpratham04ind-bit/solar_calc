<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peanuts Solar Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tech-font { font-family: 'Space Grotesk', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .modal-bg { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); }
        input { font-size: 16px !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-cyan-500 selection:text-slate-900 pb-24">

    <header class="border-b border-slate-900 bg-slate-950/80 sticky top-0 z-40 backdrop-blur-md px-4 py-4">
        <div class="flex items-center justify-between">
            <h1 class="tech-font text-base font-bold bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent">
                PEANUTS SOLAR LABS
            </h1>
            <div class="flex items-center space-x-2 bg-slate-900 px-2.5 py-1 rounded-full border border-slate-800">
                <div class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></div>
                <span class="text-[10px] tech-font font-bold tracking-wider text-slate-400 uppercase">Online</span>
            </div>
        </div>
    </header>

    <main class="px-4 py-6 flex-grow flex flex-col justify-center max-w-md mx-auto w-full">
        <div class="mb-6">
            <h2 class="text-2xl font-bold tracking-tight text-white">Telemetry Control</h2>
            <p class="text-xs text-slate-400 mt-1">Select mode for Eastman 4.8kWh calculations</p>
        </div>

        <div class="space-y-4 w-full">
            
            <button onclick="openModal('dischargeModal')" class="w-full glass p-5 rounded-xl text-left active:scale-[0.98] transition-all duration-150 flex items-center justify-between group focus:outline-none">
                <div class="flex items-center space-x-4">
                    <div class="h-11 w-11 rounded-lg bg-cyan-500/10 flex items-center justify-center text-cyan-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="tech-font text-base font-bold text-white">Discharge Calculator</h3>
                        <p class="text-[11px] text-slate-400 mt-0.5">Find runtime remaining till 15%</p>
                    </div>
                </div>
                <span class="text-slate-500 text-sm font-bold pr-1">→</span>
            </button>

            <button onclick="openModal('chargeModal')" class="w-full glass p-5 rounded-xl text-left active:scale-[0.98] transition-all duration-150 flex items-center justify-between group focus:outline-none">
                <div class="flex items-center space-x-4">
                    <div class="h-11 w-11 rounded-lg bg-emerald-500/10 flex items-center justify-center text-emerald-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 11l3-3m0 0l3 3m-3-3v8m0-13a9 9 0 110 18 9 9 0 010-18z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="tech-font text-base font-bold text-white">Charge Calculator</h3>
                        <p class="text-[11px] text-slate-400 mt-0.5">Find hours required to reach 100%</p>
                    </div>
                </div>
                <span class="text-slate-500 text-sm font-bold pr-1">→</span>
            </button>

        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 glass border-t border-slate-800 px-6 py-4 flex justify-between items-center z-30 max-w-md mx-auto rounded-t-2xl">
        <div class="text-[10px] text-slate-500 font-medium">SYS: Eastman Node v2.1</div>
        <div class="text-[10px] text-slate-500 font-medium">Target Floor Operations</div>
    </div>

    <div id="dischargeModal" class="fixed inset-0 z-50 modal-bg flex items-start sm:items-center justify-center p-0 sm:p-4 hidden opacity-0 transition-opacity duration-200 overflow-y-auto">
        <div class="bg-slate-900 w-full max-w-md rounded-b-2xl sm:rounded-2xl border-b sm:border border-slate-800 shadow-2xl overflow-hidden transform -translate-y-full sm:translate-y-0 sm:scale-95 transition-all duration-200 mt-0 sm:mt-10">
            <div class="p-5 border-b border-slate-800/60 flex justify-between items-center">
                <h3 class="tech-font text-base font-bold text-cyan-400 flex items-center gap-2">⚡ Discharge Telemetry</h3>
                <button onclick="closeModal('dischargeModal')" class="h-8 w-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 active:bg-slate-700 focus:outline-none">&times;</button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Current Battery %</label>
                    <input type="number" id="dis_pct" pattern="[0-9]*" inputmode="numeric" placeholder="e.g., 50" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 transition-colors">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Shop Load (Watts)</label>
                    <input type="number" id="dis_load" pattern="[0-9]*" inputmode="numeric" placeholder="e.g., 500" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 transition-colors">
                </div>
                <button onclick="calculateDischarge()" class="w-full bg-cyan-500 active:bg-cyan-600 text-slate-950 tech-font font-bold py-3.5 rounded-xl transition shadow-lg shadow-cyan-500/10 mt-2">
                    RUN PROJECTION
                </button>
                
                <div id="dis_wrapper" class="hidden mt-2 space-y-3 bg-slate-950 p-4 rounded-xl border border-slate-800/80">
                    <div id="dis_result" class="text-center font-bold text-base text-cyan-400 tech-font"></div>
                    <div class="w-full bg-slate-900 rounded-full h-3 overflow-hidden border border-slate-800">
                        <div id="dis_progress" class="h-full w-0 transition-all duration-500 ease-out"></div>
                    </div>
                    <div class="flex justify-between text-[10px] text-slate-500 font-semibold uppercase tracking-wider px-0.5">
                        <span>Current</span>
                        <span>15% Safe Limit</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="chargeModal" class="fixed inset-0 z-50 modal-bg flex items-start sm:items-center justify-center p-0 sm:p-4 hidden opacity-0 transition-opacity duration-200 overflow-y-auto">
        <div class="bg-slate-900 w-full max-w-md rounded-b-2xl sm:rounded-2xl border-b sm:border border-slate-800 shadow-2xl overflow-hidden transform -translate-y-full sm:translate-y-0 sm:scale-95 transition-all duration-200 mt-0 sm:mt-10">
            <div class="p-5 border-b border-slate-800/60 flex justify-between items-center">
                <h3 class="tech-font text-base font-bold text-emerald-400 flex items-center gap-2">🔋 Charge Telemetry</h3>
                <button onclick="closeModal('chargeModal')" class="h-8 w-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 active:bg-slate-700 focus:outline-none">&times;</button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Current Battery %</label>
                    <input type="number" id="chg_pct" pattern="[0-9]*" inputmode="numeric" placeholder="e.g., 14" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Solar Charger Power (Watts)</label>
                    <input type="number" id="chg_watts" pattern="[0-9]*" inputmode="numeric" placeholder="e.g., 2600" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <button onclick="calculateCharge()" class="w-full bg-emerald-500 active:bg-emerald-600 text-slate-950 tech-font font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/10 mt-2">
                    RUN PROJECTION
                </button>
                
                <div id="chg_wrapper" class="hidden mt-2 space-y-3 bg-slate-950 p-4 rounded-xl border border-slate-800/80">
                    <div id="chg_result" class="text-center font-bold text-base text-emerald-400 tech-font"></div>
                    <div class="w-full bg-slate-900 rounded-full h-3 overflow-hidden border border-slate-800">
                        <div id="chg_progress" class="h-full w-0 transition-all duration-500 ease-out"></div>
                    </div>
                    <div class="flex justify-between text-[10px] text-slate-500 font-semibold uppercase tracking-wider px-0.5">
                        <span>Current Status</span>
                        <span>100% Target</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TOTAL_CAPACITY_WH = 4800; // 48V * 100Ah = 4800Wh

        // Keyboard Safety: Drop down smoothly from top area
        function openModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.add('opacity-100');
                modal.firstElementChild.classList.remove('-translate-y-full');
            }, 10);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('opacity-100');
            modal.firstElementChild.classList.add('-translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('dis_wrapper').classList.add('hidden');
                document.getElementById('chg_wrapper').classList.add('hidden');
            }, 200);
        }

        window.onclick = function(event) {
            if (event.target.classList.contains('modal-bg')) {
                closeModal(event.target.id);
            }
        }

        function formatTime(decimalHours) {
            if (decimalHours <= 0) return "0 mins";
            const hours = Math.floor(decimalHours);
            const minutes = Math.round((decimalHours - hours) * 60);
            if (hours === 0) return `${minutes} mins`;
            return `${hours} hr ${minutes} mins`;
        }

        function calculateDischarge() {
            const currentPct = parseFloat(document.getElementById('dis_pct').value);
            const loadWatts = parseFloat(document.getElementById('dis_load').value);
            const wrapper = document.getElementById('dis_wrapper');
            const resultDiv = document.getElementById('dis_result');
            const progressBar = document.getElementById('dis_progress');

            if (!currentPct || !loadWatts || currentPct <= 15 || currentPct > 100 || loadWatts <= 0) {
                wrapper.classList.remove('hidden');
                resultDiv.className = "text-center font-medium text-xs text-red-400";
                resultDiv.innerText = "❌ Bounds Alert: Entry must be greater than 15%.";
                progressBar.style.width = "0%";
                return;
            }

            const targetPct = 15;
            const usablePctChange = currentPct - targetPct;
            const usableEnergyWh = TOTAL_CAPACITY_WH * (usablePctChange / 100);
            const hoursLeft = usableEnergyWh / loadWatts;

            // Display values
            wrapper.classList.remove('hidden');
            resultDiv.className = "text-center font-bold text-base text-cyan-400 tech-font";
            resultDiv.innerText = `⏳ Approx. ${formatTime(hoursLeft)} left`;

            // Color code bar based on current percentage remaining
            progressBar.className = "h-full transition-all duration-500 ease-out";
            if (currentPct > 50) {
                progressBar.classList.add('bg-emerald-500'); // Green
            } else if (currentPct > 30) {
                progressBar.classList.add('bg-amber-500');   // Yellow/Orange
            } else {
                progressBar.classList.add('bg-red-500');     // Red danger zone
            }
            
            // Set scale size
            setTimeout(() => { progressBar.style.width = `${currentPct}%`; }, 50);
        }

        function calculateCharge() {
            const currentPct = parseFloat(document.getElementById('chg_pct').value);
            const chgWatts = parseFloat(document.getElementById('chg_watts').value);
            const wrapper = document.getElementById('chg_wrapper');
            const resultDiv = document.getElementById('chg_result');
            const progressBar = document.getElementById('chg_progress');

            if (isNaN(currentPct) || !chgWatts || currentPct < 0 || currentPct >= 100 || chgWatts <= 0) {
                wrapper.classList.remove('hidden');
                resultDiv.className = "text-center font-medium text-xs text-red-400";
                resultDiv.innerText = "❌ Bounds Alert: Entry must be 0-99.";
                progressBar.style.width = "0%";
                return;
            }

            const neededPctChange = 100 - currentPct;
            let neededEnergyWh = TOTAL_CAPACITY_WH * (neededPctChange / 100);
            neededEnergyWh = neededEnergyWh / 0.90; 
            const hoursRequired = neededEnergyWh / chgWatts;

            wrapper.classList.remove('hidden');
            resultDiv.className = "text-center font-bold text-base text-emerald-400 tech-font";
            resultDiv.innerText = `⚡ Approx. ${formatTime(hoursRequired)} remaining`;

            // Filling up bar from current charging progress state
            progressBar.className = "h-full transition-all duration-500 ease-out";
            if (currentPct < 30) {
                progressBar.classList.add('bg-red-500');
            } else if (currentPct < 75) {
                progressBar.classList.add('bg-amber-500');
            } else {
                progressBar.classList.add('bg-emerald-500');
            }

            setTimeout(() => { progressBar.style.width = `${currentPct}%`; }, 50);
        }
    </script>
</body>
</html>
