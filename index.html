<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peanuts Solar Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .tech-font { font-family: 'Space Grotesk', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .modal-bg { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-cyan-500 selection:text-slate-900">

    <header class="border-b border-slate-800/60 bg-slate-950/80 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
                <span class="tech-font font-bold tracking-wider text-sm text-slate-400 uppercase">System Active</span>
            </div>
            <h1 class="tech-font text-lg font-bold bg-gradient-to-r edit bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent">
                PEANUTS SOLAR LABS
            </h1>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-12 flex-grow flex flex-col justify-center w-full">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold tracking-tight text-white mb-2">Battery Smart Estimator</h2>
            <p class="text-sm text-slate-400">Precision telemetry metrics tailored for Eastman 4.8kWh Systems</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full">
            
            <button onclick="openModal('dischargeModal')" class="glass p-8 rounded-2xl text-left hover:border-cyan-500/40 transition-all duration-300 group hover:-translate-y-1 focus:outline-none">
                <div class="h-12 w-12 rounded-xl bg-cyan-500/10 flex items-center justify-center text-cyan-400 mb-6 group-hover:bg-cyan-500 group-hover:text-slate-950 transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <h3 class="tech-font text-xl font-bold text-white mb-2 flex items-center justify-between">
                    Discharge Mode 
                    <span class="text-xs text-cyan-400 font-normal tracking-wider opacity-0 group-hover:opacity-100 transition-opacity duration-300">OPEN →</span>
                </h3>
                <p class="text-xs text-slate-400 leading-relaxed">Calculate exact operating runtime available before the reserve thresholds hit 15% system critical limit.</p>
            </button>

            <button onclick="openModal('chargeModal')" class="glass p-8 rounded-2xl text-left hover:border-emerald-500/40 transition-all duration-300 group hover:-translate-y-1 focus:outline-none">
                <div class="h-12 w-12 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400 mb-6 group-hover:bg-emerald-500 group-hover:text-slate-950 transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 11l3-3m0 0l3 3m-3-3v8m0-13a9 9 0 110 18 9 9 0 010-18z" />
                    </svg>
                </div>
                <h3 class="tech-font text-xl font-bold text-white mb-2 flex items-center justify-between">
                    Charge Mode
                    <span class="text-xs text-emerald-400 font-normal tracking-wider opacity-0 group-hover:opacity-100 transition-opacity duration-300">OPEN →</span>
                </h3>
                <p class="text-xs text-slate-400 leading-relaxed">Input real-time solar panel or grid charger array input metrics to isolate time vectors remaining to target 100% full capacity.</p>
            </button>

        </div>
    </main>

    <div id="dischargeModal" class="fixed inset-0 z-50 modal-bg flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 w-full max-w-md rounded-2xl border border-slate-800 shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                <h3 class="tech-font text-lg font-bold text-cyan-400 flex items-center gap-2">⏱️ Discharge Telemetry</h3>
                <button onclick="closeModal('dischargeModal')" class="text-slate-400 hover:text-white text-xl focus:outline-none">&times;</button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Current Battery %</label>
                    <input type="number" id="dis_pct" min="16" max="100" placeholder="e.g., 50" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Current Shop Load (Watts)</label>
                    <input type="number" id="dis_load" min="1" placeholder="e.g., 500" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 transition-colors">
                </div>
                <button onclick="calculateDischarge()" class="w-full bg-cyan-500 hover:bg-cyan-600 text-slate-950 tech-font font-bold py-3.5 rounded-xl transition shadow-lg shadow-cyan-500/10 mt-2">
                    RUN PROJECTION
                </button>
                <div id="dis_result" class="p-4 rounded-xl text-center font-medium text-sm hidden"></div>
            </div>
        </div>
    </div>

    <div id="chargeModal" class="fixed inset-0 z-50 modal-bg flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 w-full max-w-md rounded-2xl border border-slate-800 shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                <h3 class="tech-font text-lg font-bold text-emerald-400 flex items-center gap-2">⚡ Charge Telemetry</h3>
                <button onclick="closeModal('chargeModal')" class="text-slate-400 hover:text-white text-xl focus:outline-none">&times;</button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Current Battery %</label>
                    <input type="number" id="chg_pct" min="0" max="99" placeholder="e.g., 14" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Solar Charger Power (Watts)</label>
                    <input type="number" id="chg_watts" min="1" placeholder="e.g., 2600" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <button onclick="calculateCharge()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 tech-font font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/10 mt-2">
                    RUN PROJECTION
                </button>
                <div id="chg_result" class="p-4 rounded-xl text-center font-medium text-sm hidden"></div>
            </div>
        </div>
    </div>

    <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-900/60 bg-slate-950">
        Engineered for Core Operations Frameworks • Terminal Version 2.0
    </footer>

    <script>
        const TOTAL_CAPACITY_WH = 4800; // 48V * 100Ah = 4800Wh

        // Modal Functionality with smooth transitions
        function openModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.add('opacity-100');
                modal.firstElementChild.classList.add('scale-100');
            }, 10);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('opacity-100');
            modal.firstElementChild.classList.remove('scale-100');
            setTimeout(() => {
                modal.classList.add('hidden');
                // Reset fields and result divs on close
                document.getElementById('dis_result').classList.add('hidden');
                document.getElementById('chg_result').classList.add('hidden');
            }, 300);
        }

        // Close on clicking outside the modal box
        window.onclick = function(event) {
            if (event.target.classList.contains('modal-bg')) {
                closeModal(event.target.id);
            }
        }

        function formatTime(decimalHours) {
            if (decimalHours <= 0) return "0 mins";
            const hours = Math.floor(decimalHours);
            const minutes = Math.round((decimalHours - hours) * 60);
            
            if (hours === 0) return `${minutes} minutes`;
            return `${hours} hr ${minutes} mins`;
        }

        function calculateDischarge() {
            const currentPct = parseFloat(document.getElementById('dis_pct').value);
            const loadWatts = parseFloat(document.getElementById('dis_load').value);
            const resultDiv = document.getElementById('dis_result');

            if (!currentPct || !loadWatts || currentPct <= 15 || currentPct > 100 || loadWatts <= 0) {
                resultDiv.className = "mt-4 p-4 bg-red-500/10 text-red-400 border border-red-500/20 rounded-xl text-center font-medium text-xs";
                resultDiv.innerText = "❌ ERROR: Invalid bounds. Battery % must be greater than 15.";
                resultDiv.classList.remove('hidden');
                return;
            }

            const targetPct = 15;
            const usablePctChange = currentPct - targetPct;
            const usableEnergyWh = TOTAL_CAPACITY_WH * (usablePctChange / 100);
            const hoursLeft = usableEnergyWh / loadWatts;

            resultDiv.className = "mt-4 p-4 bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 rounded-xl text-center tech-font font-bold text-base";
            resultDiv.innerText = `⏳ Approx. ${formatTime(hoursLeft)} until 15% threshold`;
            resultDiv.classList.remove('hidden');
        }

        function calculateCharge() {
            const currentPct = parseFloat(document.getElementById('chg_pct').value);
            const chgWatts = parseFloat(document.getElementById('chg_watts').value);
            const resultDiv = document.getElementById('chg_result');

            if (isNaN(currentPct) || !chgWatts || currentPct < 0 || currentPct >= 100 || chgWatts <= 0) {
                resultDiv.className = "mt-4 p-4 bg-red-500/10 text-red-400 border border-red-500/20 rounded-xl text-center font-medium text-xs";
                resultDiv.innerText = "❌ ERROR: Invalid bounds. Battery % entry must be 0-99.";
                resultDiv.classList.remove('hidden');
                return;
            }

            const neededPctChange = 100 - currentPct;
            let neededEnergyWh = TOTAL_CAPACITY_WH * (neededPctChange / 100);
            
            // 10% thermal efficiency overhead correction
            neededEnergyWh = neededEnergyWh / 0.90;
            const hoursRequired = neededEnergyWh / chgWatts;

            resultDiv.className = "mt-4 p-4 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-xl text-center tech-font font-bold text-base";
            resultDiv.innerText = `⚡ Approx. ${formatTime(hoursRequired)} to reach 100%`;
            resultDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
